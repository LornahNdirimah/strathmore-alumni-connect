# DESIGN_BACKLOG #54: every push and pull request runs the full check —
# typecheck, the backend, frontend and matching-engine tests, the production
# build — and then the browser tests against the site served as it is deployed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml-matching/MachineLearning/requirements*.txt

      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          python -m pip install -r ml-matching/MachineLearning/requirements.txt -r ml-matching/MachineLearning/requirements-dev.txt

      - name: Verify
        run: npm run verify

  browser:
    name: Browser tests (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml-matching/MachineLearning/requirements.txt

      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
          python -m pip install -r ml-matching/MachineLearning/requirements.txt
          npm --prefix e2e run install-browser

      - name: Build the frontend
        run: npm --prefix frontend run build

      - name: Run the browser tests
        run: npm --prefix e2e test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
